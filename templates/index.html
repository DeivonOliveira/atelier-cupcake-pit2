<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atelier do Cupcake | Confeitaria Gourmet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDF8F5; color: #3B1E14; }
    h1, h2, h3, .font-serif-title { font-family: 'Playfair Display', serif; }
    .bg-cocoa { background-color: #4A1C11; }
    .bg-cocoa-dark { background-color: #321109; }
    .text-cocoa { color: #4A1C11; }
    .bg-peach { background-color: #F5E1D5; }
    .btn-primary { background-color: #6E2614; color: #FFF; transition: all .2s; }
    .btn-primary:hover { background-color: #4A1C11; }
    @media print {
      .no-print { display: none !important; }
      body { background: #FFF; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <div class="bg-cocoa-dark text-amber-100 text-xs py-2 px-4 no-print">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span id="api-badge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-900/80 text-emerald-200 font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          API Python MVC + SQLite Conectada
        </span>
        <span class="hidden sm:inline text-amber-200/75">| Cupom de teste: <strong>CUPCAKE10</strong></span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="app.navigate('logs')" class="underline hover:text-white">Registro de Testes (QA)</button>
        <label class="inline-flex items-center gap-1.5 cursor-pointer bg-amber-950 px-2.5 py-1 rounded border border-amber-700/50">
          <input type="checkbox" id="admin-toggle" onchange="app.toggleAdmin(this.checked)" class="accent-amber-500">
          <span class="font-semibold text-amber-200">Modo Administrador</span>
        </label>
      </div>
    </div>
  </div>

  <header class="bg-cocoa text-white shadow-md sticky top-0 z-30 no-print">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3 cursor-pointer" onclick="app.navigate('home')">
        <span class="text-3xl">🧁</span>
        <div>
          <h1 class="text-xl font-bold tracking-tight leading-none">Atelier do Cupcake</h1>
          <p class="text-xs text-amber-200/80">Confeitaria Artesanal & Delivery</p>
        </div>
      </div>

      <nav class="flex flex-wrap items-center gap-2 sm:gap-5 text-sm font-medium">
        <button onclick="app.navigate('home')" class="hover:text-amber-300 transition">Vitrine</button>
        <button onclick="app.navigate('historia')" class="hover:text-amber-300 transition">Historia</button>
        <button onclick="app.navigate('parceiros')" class="hover:text-amber-300 transition">Parceiros</button>
        <button onclick="app.navigate('pedidos')" class="hover:text-amber-300 transition">Meus Pedidos</button>
        <button id="nav-admin" onclick="app.navigate('admin')" class="hidden bg-amber-500 text-cocoa-dark px-3 py-1 rounded-full font-bold text-xs">Painel Admin</button>
      </nav>

      <div class="flex items-center gap-3">
        <button onclick="app.navigate('auth')" id="user-btn" class="flex items-center gap-2 bg-white/10 hover:bg-white/20 px-3 py-2 rounded-lg text-xs sm:text-sm transition">
          <span>👤</span>
          <span id="user-label">Entrar / Cadastrar</span>
        </button>
        <button onclick="app.navigate('carrinho')" class="relative flex items-center gap-2 bg-amber-500 hover:bg-amber-400 text-cocoa-dark font-bold px-3.5 py-2 rounded-lg text-xs sm:text-sm transition">
          <span>🛒</span>
          <span class="hidden sm:inline">Carrinho</span>
          <span id="cart-count" class="bg-cocoa-dark text-white text-xs px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden max-w-sm bg-cocoa-dark text-white px-4 py-3 rounded-xl shadow-xl border border-amber-500/40 text-sm"></div>

  <main id="app-view" class="flex-1 max-w-6xl w-full mx-auto px-4 py-8"></main>

  <footer class="bg-cocoa-dark text-amber-200/80 text-xs py-6 px-4 mt-12 no-print">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
      <p><strong>Atelier do Cupcake</strong> — Projeto Integrador Transdisciplinar em Engenharia de Software II (MVC).</p>
      <p>Cliente demo: <code class="text-white">cliente@cupcake.com</code> | Senha: <code class="text-white">123456</code></p>
    </div>
  </footer>

  <script>
    const SEED_CUPCAKES = [
      { id: 1, nome: 'Red Velvet Classico', categoria: 'Tradicionais', descricao: 'Massa aveludada de cacau suave com cobertura cremosa de cream cheese.', preco: 14.90, imagem_emoji: '🧁' },
      { id: 2, nome: 'Belga Trufado 70%', categoria: 'Especiais', descricao: 'Chocolate belga intenso recheado com ganache meio amargo e raspas.', preco: 16.50, imagem_emoji: '🍫' },
      { id: 3, nome: 'Pistache Siciliano', categoria: 'Especiais', descricao: 'Massa de baunilha bourbon com creme artesanal de pistache torrado.', preco: 18.90, imagem_emoji: '🌿' },
      { id: 4, nome: 'Ninho com Nutella', categoria: 'Tradicionais', descricao: 'Massa fofinha de leite Ninho com coracao cremoso de creme de avela.', preco: 15.90, imagem_emoji: '🤎' },
      { id: 5, nome: 'Limao Siciliano & Merengue', categoria: 'Tradicionais', descricao: 'Curd citrico de limao siciliano finalizado com merengue macaricado.', preco: 14.50, imagem_emoji: '🍋' },
      { id: 6, nome: 'Cacau Vegano & Frutas Vermelhas', categoria: 'Veganos', descricao: '100% vegetal, sem lactose, com geleia artesanal de framboesa e morango.', preco: 16.00, imagem_emoji: '🍓' }
    ];

    const app = {
      state: {
        route: 'home',
        isAdmin: false,
        apiOnline: false,
        cupcakes: [],
        categoriaFiltro: 'Todos',
        buscaFiltro: '',
        carrinho: JSON.parse(localStorage.getItem('cupcake_cart') || '[]'),
        cupom: '',
        cep: '80420-000',
        freteCalculado: 8.50,
        usuario: JSON.parse(localStorage.getItem('cupcake_user') || 'null'),
        pedidos: [],
        qaLogs: JSON.parse(localStorage.getItem('cupcake_qa_logs') || '[]'),
        reciboAtual: null
      },

      logEvent(tipo, descricao) {
        const entry = { hora: new Date().toLocaleTimeString('pt-BR'), tipo, descricao };
        this.state.qaLogs.unshift(entry);
        this.state.qaLogs = this.state.qaLogs.slice(0, 30);
        localStorage.setItem('cupcake_qa_logs', JSON.stringify(this.state.qaLogs));
      },

      toast(msg, isError = false) {
        const el = document.getElementById('toast');
        el.textContent = (isError ? '⚠️ ' : '✅ ') + msg;
        el.className = `fixed bottom-5 right-5 z-50 max-w-sm px-4 py-3 rounded-xl shadow-xl text-sm font-medium ${isError ? 'bg-red-800 text-white' : 'bg-cocoa-dark text-white border border-amber-400/50'}`;
        el.classList.remove('hidden');
        this.logEvent(isError ? 'ERRO TRATADO' : 'SUCESSO', msg);
        setTimeout(() => el.classList.add('hidden'), 3800);
      },

      async init() {
        try {
          const res = await fetch('/api/health');
          if (res.ok) this.state.apiOnline = true;
        } catch (e) {
          this.state.apiOnline = false;
        }

        const badge = document.getElementById('api-badge');
        if (!this.state.apiOnline) {
          badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-amber-900 text-amber-200 font-medium';
          badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400"></span> Modo Local (Fallback Offline)';
        }

        await this.carregarCupcakes();
        this.atualizarHeader();
        this.render();
      },

      async carregarCupcakes() {
        if (this.state.apiOnline) {
          const params = new URLSearchParams();
          if (this.state.categoriaFiltro !== 'Todos') params.set('categoria', this.state.categoriaFiltro);
          if (this.state.buscaFiltro) params.set('busca', this.state.buscaFiltro);
          const res = await fetch('/api/cupcakes?' + params.toString());
          this.state.cupcakes = await res.json();
        } else {
          const local = JSON.parse(localStorage.getItem('cupcake_catalog') || JSON.stringify(SEED_CUPCAKES));
          this.state.cupcakes = local.filter(c => {
            const matchCat = this.state.categoriaFiltro === 'Todos' || c.categoria === this.state.categoriaFiltro;
            const matchBusca = !this.state.buscaFiltro || c.nome.toLowerCase().includes(this.state.buscaFiltro.toLowerCase());
            return matchCat && matchBusca;
          });
        }
      },

      atualizarHeader() {
        const qtd = this.state.carrinho.reduce((acc, i) => acc + i.quantidade, 0);
        document.getElementById('cart-count').textContent = qtd;
        const userLabel = document.getElementById('user-label');
        userLabel.textContent = this.state.usuario ? this.state.usuario.nome.split(' ')[0] + ' (Perfil)' : 'Entrar / Cadastrar';
      },

      toggleAdmin(ativo) {
        this.state.isAdmin = ativo;
        document.getElementById('nav-admin').classList.toggle('hidden', !ativo);
        this.toast(ativo ? 'Modo Administrador ativado.' : 'Modo Cliente ativado.');
        if (ativo) this.navigate('admin');
        else if (this.state.route === 'admin') this.navigate('home');
      },

      async navigate(route) {
        this.state.route = route;
        if (route === 'home' || route === 'admin') await this.carregarCupcakes();
        if (route === 'pedidos' || route === 'admin') await this.carregarPedidos();
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      addCarrinho(id) {
        const prod = this.state.cupcakes.find(c => c.id === id);
        if (!prod) return;
        const item = this.state.carrinho.find(i => i.id === id);
        if (item) item.quantidade += 1;
        else this.state.carrinho.push({ ...prod, quantidade: 1 });
        localStorage.setItem('cupcake_cart', JSON.stringify(this.state.carrinho));
        this.atualizarHeader();
        this.toast(`"${prod.nome}" adicionado ao carrinho!`);
      },

      alterarQtd(id, delta) {
        const idx = this.state.carrinho.findIndex(i => i.id === id);
        if (idx === -1) return;
        this.state.carrinho[idx].quantidade += delta;
        if (this.state.carrinho[idx].quantidade <= 0) this.state.carrinho.splice(idx, 1);
        localStorage.setItem('cupcake_cart', JSON.stringify(this.state.carrinho));
        this.atualizarHeader();
        this.render();
      },

      getTotais() {
        const subtotal = this.state.carrinho.reduce((s, i) => s + i.preco * i.quantidade, 0);
        const desconto = this.state.cupom.trim().toUpperCase() === 'CUPCAKE10' ? subtotal * 0.10 : 0;
        const frete = subtotal === 0 ? 0 : (subtotal >= 60 ? 0 : this.state.freteCalculado);
        const total = Math.max(0, subtotal - desconto + frete);
        return { subtotal, desconto, frete, total };
      },

      async calcularFrete(cepInput) {
        this.state.cep = cepInput;
        const limpo = cepInput.replace(/\D/g, '');
        if (limpo.length !== 8) {
          this.toast('CEP invalido! Informe exatamente 8 digitos.', true);
          return;
        }
        if (this.state.apiOnline) {
          const res = await fetch('/api/frete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cep: limpo, itens: this.state.carrinho, cupom: this.state.cupom })
          });
          const data = await res.json();
          if (data.ok) this.state.freteCalculado = data.frete;
        } else {
          this.state.freteCalculado = limpo.startsWith('80') ? 8.50 : 12.90;
        }
        this.toast(`Frete calculado para CEP ${cepInput}: R$ ${this.state.freteCalculado.toFixed(2)}`);
        this.render();
      },

      aplicarCupom(codigo) {
        this.state.cupom = codigo.trim().toUpperCase();
        if (this.state.cupom === 'CUPCAKE10') {
          this.toast('Cupom CUPCAKE10 aplicado! 10% de desconto.');
        } else if (this.state.cupom) {
          this.toast('Cupom invalido. Use CUPCAKE10 para testar.', true);
          this.state.cupom = '';
        }
        this.render();
      },

      async login(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const senha = document.getElementById('login-senha').value;
        if (this.state.apiOnline) {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, senha })
          });
          const data = await res.json();
          if (!data.ok) {
            this.toast(data.erro, true);
            return;
          }
          this.state.usuario = data.usuario;
        } else {
          if (email === 'cliente@cupcake.com' && senha === '123456') {
            this.state.usuario = {
              id: 1, nome: 'Cliente Demonstracao', email, cpf: '123.456.789-00', rg: '12.345.678-9',
              enderecos: [{ id: 1, apelido: 'Casa', rua: 'Rua das Flores', numero: '420', bairro: 'Batel', cep: '80420-000' }]
            };
          } else {
            this.toast('Credenciais invalidas! Use cliente@cupcake.com / 123456.', true);
            return;
          }
        }
        localStorage.setItem('cupcake_user', JSON.stringify(this.state.usuario));
        this.atualizarHeader();
        this.toast(`Bem-vindo(a), ${this.state.usuario.nome}!`);
        this.navigate('perfil');
      },

      async cadastrar(e) {
        e.preventDefault();
        const payload = {
          nome: document.getElementById('cad-nome').value,
          email: document.getElementById('cad-email').value,
          senha: document.getElementById('cad-senha').value,
          cpf: document.getElementById('cad-cpf').value,
          rg: document.getElementById('cad-rg').value
        };
        if (this.state.apiOnline) {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!data.ok) {
            this.toast(data.erro, true);
            return;
          }
          this.state.usuario = data.usuario;
        } else {
          this.state.usuario = { id: Date.now(), ...payload, enderecos: [] };
        }
        localStorage.setItem('cupcake_user', JSON.stringify(this.state.usuario));
        this.atualizarHeader();
        this.toast('Conta criada com sucesso!');
        this.navigate('perfil');
      },

      async recuperarSenha() {
        const email = prompt('Digite o e-mail cadastrado para desbloquear/redefinir a senha (nova senha padrao: 123456):');
        if (!email) return;
        if (this.state.apiOnline) {
          const res = await fetch('/api/auth/recuperar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, nova_senha: '123456' })
          });
          const data = await res.json();
          this.toast(data.ok ? data.mensagem : data.erro, !data.ok);
        } else {
          this.toast('Senha redefinida para 123456!');
        }
      },

      logout() {
        this.state.usuario = null;
        localStorage.removeItem('cupcake_user');
        this.atualizarHeader();
        this.toast('Sessao encerrada.');
        this.navigate('home');
      },

      async salvarEndereco(e) {
        e.preventDefault();
        const end = {
          apelido: document.getElementById('end-apelido').value || 'Casa',
          rua: document.getElementById('end-rua').value,
          numero: document.getElementById('end-num').value,
          bairro: document.getElementById('end-bairro').value,
          cep: document.getElementById('end-cep').value,
          complemento: ''
        };
        if (this.state.apiOnline) {
          const res = await fetch(`/api/clientes/${this.state.usuario.id}/enderecos`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(end)
          });
          const data = await res.json();
          if (data.ok) this.state.usuario.enderecos = data.enderecos;
        } else {
          this.state.usuario.enderecos = this.state.usuario.enderecos || [];
          this.state.usuario.enderecos.push({ id: Date.now(), ...end });
        }
        localStorage.setItem('cupcake_user', JSON.stringify(this.state.usuario));
        this.toast('Novo endereco salvo no perfil!');
        this.render();
      },

      async finalizarPedido(e) {
        e.preventDefault();
        if (!this.state.usuario) {
          this.toast('Faca login antes de finalizar o pedido.', true);
          this.navigate('auth');
          return;
        }
        const endereco = document.getElementById('chk-endereco').value;
        const pagamento = document.querySelector('input[name="pagamento"]:checked').value;
        if (!endereco) {
          this.toast('Cadastre ou informe um endereco de entrega.', true);
          return;
        }

        const payload = {
          cliente_id: this.state.usuario.id,
          endereco_entrega: endereco,
          forma_pagamento: pagamento,
          itens: this.state.carrinho,
          cep: this.state.cep,
          cupom: this.state.cupom
        };

        let novoPedido;
        if (this.state.apiOnline) {
          const res = await fetch('/api/pedidos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!data.ok) {
            this.toast(data.erro, true);
            return;
          }
          novoPedido = { ...data.pedido, ...payload, cliente_nome: this.state.usuario.nome, criado_em: new Date().toLocaleString('pt-BR') };
        } else {
          const totais = this.getTotais();
          novoPedido = {
            id: Date.now(),
            codigo: '#PED-' + Math.floor(1000 + Math.random() * 9000),
            ...payload,
            ...totais,
            status: 'Pedido Recebido',
            cliente_nome: this.state.usuario.nome,
            criado_em: new Date().toLocaleString('pt-BR')
          };
          const hist = JSON.parse(localStorage.getItem('cupcake_orders') || '[]');
          hist.unshift(novoPedido);
          localStorage.setItem('cupcake_orders', JSON.stringify(hist));
        }

        this.state.carrinho = [];
        this.state.cupom = '';
        localStorage.setItem('cupcake_cart', '[]');
        this.atualizarHeader();
        this.state.reciboAtual = novoPedido;
        this.toast(`Pedido ${novoPedido.codigo} confirmado!`);
        this.navigate('recibo');
      },

      async carregarPedidos() {
        if (this.state.apiOnline) {
          const url = (!this.state.isAdmin && this.state.usuario)
            ? `/api/pedidos?cliente_id=${this.state.usuario.id}`
            : '/api/pedidos';
          const res = await fetch(url);
          this.state.pedidos = await res.json();
        } else {
          this.state.pedidos = JSON.parse(localStorage.getItem('cupcake_orders') || '[]');
        }
      },

      async salvarCupcakeAdmin(e) {
        e.preventDefault();
        const payload = {
          nome: document.getElementById('adm-nome').value,
          categoria: document.getElementById('adm-cat').value,
          preco: parseFloat(document.getElementById('adm-preco').value),
          imagem_emoji: document.getElementById('adm-emoji').value || '🧁',
          descricao: document.getElementById('adm-desc').value
        };
        if (this.state.apiOnline) {
          await fetch('/api/cupcakes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } else {
          const local = JSON.parse(localStorage.getItem('cupcake_catalog') || JSON.stringify(SEED_CUPCAKES));
          local.push({ id: Date.now(), ...payload });
          localStorage.setItem('cupcake_catalog', JSON.stringify(local));
        }
        this.toast(`Cupcake "${payload.nome}" cadastrado na vitrine!`);
        await this.carregarCupcakes();
        this.render();
      },

      async excluirCupcakeAdmin(id) {
        if (this.state.apiOnline) {
          await fetch(`/api/cupcakes/${id}`, { method: 'DELETE' });
        } else {
          const local = JSON.parse(localStorage.getItem('cupcake_catalog') || JSON.stringify(SEED_CUPCAKES));
          localStorage.setItem('cupcake_catalog', JSON.stringify(local.filter(c => c.id !== id)));
        }
        this.toast('Produto removido da vitrine.');
        await this.carregarCupcakes();
        this.render();
      },

      async mudarStatusPedido(id, status) {
        if (this.state.apiOnline) {
          await fetch(`/api/pedidos/${id}/status`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
          });
        }
        this.toast(`Status do pedido atualizado para "${status}".`);
        await this.carregarPedidos();
        this.render();
      },

      render() {
        const el = document.getElementById('app-view');
        const r = this.state.route;

        if (r === 'home') {
          const cats = ['Todos', 'Tradicionais', 'Especiais', 'Veganos'];
          el.innerHTML = `
            <section class="bg-peach rounded-2xl p-6 sm:p-10 mb-8 flex flex-col md:flex-row items-center justify-between gap-6 border border-amber-900/10">
              <div class="max-w-xl">
                <span class="text-xs font-bold uppercase tracking-wider text-amber-900 bg-white/70 px-3 py-1 rounded-full">Fornada Fresca Todos os Dias</span>
                <h2 class="text-3xl sm:text-4xl font-bold text-cocoa mt-3 mb-3">Cupcakes artesanais feitos com ingredientes nobres.</h2>
                <p class="text-sm sm:text-base text-amber-950/80 mb-5">Escolha seus sabores favoritos, aplique o cupom <strong>CUPCAKE10</strong> e receba em casa com entrega rastreada.</p>
                <div class="flex flex-wrap gap-3">
                  <input type="text" placeholder="Buscar sabor (ex: Pistache, Red Velvet)..." value="${this.state.buscaFiltro}"
                    oninput="app.state.buscaFiltro=this.value; app.carregarCupcakes().then(()=>app.render())"
                    class="px-4 py-2.5 rounded-xl border border-amber-900/20 bg-white text-sm w-full sm:w-72 focus:outline-none focus:ring-2 focus:ring-amber-700">
                </div>
              </div>
              <div class="text-7xl sm:text-8xl select-none">🧁✨</div>
            </section>

            <div class="flex flex-wrap items-center gap-2 mb-6">
              ${cats.map(c => `

                <div>
                  <h2 class="text-2xl font-bold text-cocoa">Registro de Evidencias & Testes (QA)</h2>
                  <p class="text-xs text-stone-500">Use esta tela para capturar evidencias de validacoes e erros tratados para o Laudo de Qualidade do PIT II.</p>
                </div>
                <button onclick="app.state.qaLogs=[]; localStorage.removeItem('cupcake_qa_logs'); app.render()" class="text-xs bg-stone-200 px-3 py-1.5 rounded-lg">Limpar Logs</button>
              </div>
              <div class="space-y-2 text-xs font-mono">
                ${this.state.qaLogs.length === 0 ? '<p class="text-stone-500">Nenhuma interacao registrada ainda. Navegue, erre uma senha ou adicione itens para gerar logs.</p>' :
                  this.state.qaLogs.map(l => `
                    <div class="p-2.5 rounded-lg border ${l.tipo === 'ERRO TRATADO' ? 'bg-red-50 border-red-200 text-red-900' : 'bg-emerald-50 border-emerald-200 text-emerald-900'}">
                      <strong>[${l.hora}] [${l.tipo}]</strong> ${l.descricao}
                    </div>
                  `).join('')
                }
              </div>
            </div>
          `;
        }
      }
    };

    app.init();
  </script>
</body>
</html>
