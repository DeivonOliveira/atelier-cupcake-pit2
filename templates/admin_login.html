<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo - Atelier Cupcake</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-pink-100">
        <div class="text-center mb-6">
            <span class="text-4xl">🧁</span>
            <h2 class="text-2xl font-bold text-gray-800 mt-2">Painel Admin</h2>
            <p class="text-xs text-gray-500 mt-1">Acesso exclusivo para gestão de pedidos</p>
        </div>
        {% if erro %}
            <div class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-xs font-semibold text-center">{{ erro }}</div>
        {% endif %}
        <form method="POST" action="/admin-login">
            <div class="mb-4">
                <label class="block text-gray-700 text-xs font-bold mb-1 uppercase">Senha de Acesso (123):</label>
                <input type="password" name="senha" placeholder="Digite 123" required class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-400">
            </div>
            <button type="submit" class="w-full bg-pink-600 text-white font-bold py-2.5 rounded-xl hover:bg-pink-700 transition shadow">Entrar no Painel</button>
        </form>
        <div class="text-center mt-6">
            <a href="/" class="text-xs text-pink-600 hover:underline font-medium">&larr; Voltar para a Vitrine da Loja</a>
        </div>
    </div>
</body>
</html>
